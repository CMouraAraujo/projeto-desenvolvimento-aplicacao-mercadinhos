spring.application.name=mercadinhos-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:mercadinhos}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${DB_USERNAME:mercadinhos}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
# Documentation is opt-in for the local profile only; security also checks the profile.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# Reject unsupported fields instead of silently ignoring role/organization input.
spring.jackson.deserialization.fail-on-unknown-properties=true
app.imagens.diretorio=${PRODUCT_IMAGES_DIR:${user.home}/.mercadinhos/imagens}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
