# Imported only when the local profile is explicitly selected.
# Supports running from the repository root or from backend/.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
# Development only: localhost uses HTTP.
server.servlet.session.cookie.secure=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=br.com.mercadinhos
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.with-credentials=true
springdoc.swagger-ui.try-it-out-enabled=false
springdoc.swagger-ui.validator-url=
